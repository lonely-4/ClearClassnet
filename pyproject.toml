[project]
name = "clearclassnet"
version = "0.1.0"
description = "Local MITM proxy framework that delivers each request and response to plugins as events."
readme = "README.md"
authors = [
    { name = "Starry-Sky-World", email = "liu_qinyu@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44",
    "h11>=0.16",
    "httpx>=0.28",
]

[project.scripts]
clearclassnet = "clearclassnet:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# uv run clearclassnet run --config presets/hnzx/clearclassnet.toml

[proxy]
host = "127.0.0.1"
port = 8899
body_limit = 1048576
timeout = 30

[logging]
level = "INFO"

[plugins]
dirs = ["presets/hnzx/plugins"]
builtins = true
disabled = []

[plugins.audit]
path = "presets/hnzx/audit.jsonl"

[plugins.blocklist]
path = "presets/hnzx/blocklist.txt"

[plugins.mitm_policy]
include = ["*"]
exclude = []

[proxy]
host = "127.0.0.1"
port = 8899
body_limit = 1048576
timeout = 30

[logging]
level = "INFO"

[plugins]
dirs = ["examples/plugins"]
builtins = true
disabled = []

[plugins.audit]
path = "audit.jsonl"

[plugins.blocklist]
path = "blocklist.txt"

[plugins.mitm_policy]
include = ["*"]
exclude = []
